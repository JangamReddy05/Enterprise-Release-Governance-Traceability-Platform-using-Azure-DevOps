trigger: none

pool:
  vmImage: ubuntu-latest

stages:

- stage: Development
  displayName: Deploy to Development

  jobs:
  - deployment: DeployDevelopment
    displayName: Development Deployment

    environment: Development

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - script: |
              echo "Deploying application to Development"
            displayName: Deploy to Development


- stage: QA
  displayName: Deploy to QA

  dependsOn: Development
  condition: succeeded()

  jobs:
  - deployment: DeployQA
    displayName: QA Deployment

    environment: QA

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - script: |
              echo "Deploying application to QA"
            displayName: Deploy to QA


- stage: Production
  displayName: Deploy to Production

  dependsOn: QA
  condition: succeeded()

  jobs:
  - deployment: DeployProduction
    displayName: Production Deployment

    environment: Production

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - script: |
              echo "Deploying application to Production"
            displayName: Deploy to Production